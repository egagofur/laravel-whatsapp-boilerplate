services:
  wa-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ngabarin-wa-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3001}
      DB_DATABASE: /var/www/html/data/database.sqlite
      WHATSAPP_WEB_SESSION_DIR: /var/www/html/storage/app/whatsapp-sidecar/sessions
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    volumes:
      - ./sessions:/var/www/html/storage/app/whatsapp-sidecar/sessions
      - ./data:/var/www/html/data
    # Chromium needs larger /dev/shm — default 64MB often causes "Page crashed!"
    # Tuned for ~2GB VPS (leave ~500MB+ for host OS). On 4GB hosts raise MEM_LIMIT.
    shm_size: ${SHM_SIZE:-256mb}
    mem_limit: ${MEM_LIMIT:-1400m}
    mem_reservation: ${MEM_RESERVATION:-768m}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${PORT:-3001}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-1400m}
        reservations:
          memory: ${MEM_RESERVATION:-768m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
